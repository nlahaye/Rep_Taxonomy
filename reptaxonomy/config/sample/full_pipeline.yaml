# full_pipeline.yaml

work_dir: /data/experiments/reptaxonomy/work
embed_dir: /data/experiments/reptaxonomy/embeddings
out_dir: /data/experiments/reptaxonomy/outputs
seed: 42
n_runs: 3

model_names:
  - clay_v1
  - satmae_large
  - prithvi_100m

projections:
  - umap
  - tsne
  - pca

dataset:
  dataset_name: ben_ge
  num_classes: 19
  ignore_index: 255

# Shared projection / subset params
label_file_subset: 2000
build_knn: true
knn_metric: euclidean

umap_n_neighbors: 30
umap_min_dist: 0.05
umap_n_components: 2
umap_spread: 1.0

pca_max_components: 64
tsne_n_jobs: 8

# Robustness / intrinsic dimension
id_methods:
  - MLE
  - TwoNN
  - TLE
  - DANCo
  - FisherS
id_k_values: [5, 10, 20]
max_id_samples: 20000

# Data-kernel analysis
number_of_bootstraps: 10
ase_n_components: 1
top_frac: 0.1

# Geodesic comparison
representation: geo_euc

# WeightWatcher
ww_min_evals: 50
ww_max_evals: 5000
ww_randomize: true
ww_mp_fit: true
ww_pool: true
ww_layers: []

# Demsar
alpha: 0.05

steps:
  compute_resource_reqs:
    enabled: true
    config_overrides: {}

  weight_matrix_analysis:
    enabled: true
    config_overrides: {}

  run_projections:
    enabled: true
    config_overrides: {}

  embedding_robustness:
    enabled: true
    config_overrides: {}

  data_kernel_analysis:
    enabled: true
    config_overrides: {}

  geodesic_compare:
    enabled: false
    config_overrides:
      representation: geo_euc

  demsar_wrapper:
    enabled: true
    config_overrides: {}

per_model_overrides:
  satmae_large:
    tsne_n_jobs: 16
