# embed_hlsburnscars_croma_dofa.yaml

work_dir: /data/nlahaye/rep_taxonomy//work
embed_dir: /data/nlahaye/rep_taxonomy//embeddings
out_dir: /data/nlahaye/rep_taxonomy//outputs
seed: 42

dataset:
  name: hlsburnscars
  dataset_name: hlsburnscars
  split: test
  task: segmentation
  instrument: HLS
  bands: [B2, B3, B4, B5, B6, B7]
  target_name: burn_scar
  bandset: hls_optical_6
  modalities: [optical]
  resolution: 30
  num_classes: 1
  ignore_index: 255
  data_root: /data/nlahaye/rep_taxonomy/data/hlsburnscars/

dataset_init:
  label_name: burn_scar
  crs: EPSG:5070
  additional_instruments: null

model_names:
  - prithvi_eo_v1_100m
  - croma_large
  - dofa_base

model_init:
  pretrained: true
  features_only: true
  device: cuda

per_model_overrides:
  prithvi_eo_v1_100m:
    weights: /data/nlahaye/output/Pangaea/model/Prithvi_100M.pt
    image_size: 512
  croma_large:
    weights: /data/nlahaye/rep_taxonomy/checkpoints/croma/CROMA_large.pt
    modalities: [optical]
    image_size: 512
    patch_size: 8
    encoder_dim: 768
    encoder_depth: 12
    num_heads: 16
    variant: large
  dofa_base:
    weights: /data/nlahaye/rep_taxonomy/checkpoints/dofa/DOFA_ViT_base_e100.pth
    image_size: 512
    wavelengths:
      HLS:
        B2: 0.49
        B3: 0.56
        B4: 0.665
        B5: 0.705
        B6: 0.74
        B7: 0.783

split: test
batch_size: 1
num_workers: 4
pin_memory: true
save_crop_info: true
overwrite: false
fail_fast: false
write_manifest: true
device: cuda

seed: 42
n_runs: 3
projections: [umap, tsne, pca]

test_batch_size: 1
test_num_workers: 4
pin_memory: true
persistent_workers: true
drop_last: false


# Pipeline execution controls.
#
# Per-model steps run separately for each model.
# Global steps run after all per-model steps have completed.
steps:
  compute_resource_reqs:
    enabled: true
    config_overrides:
      device: cuda

  weight_matrix_analysis:
    enabled: true
    config_overrides:
      # Add model-analysis-specific options here if that module requires them.
      seed: 42

  run_projections:
    enabled: true
    config_overrides:
      # Embedding/projection generation settings.
      test_batch_size: 1
      test_num_workers: 4
      batch_size: 1
      num_workers: 4
      device: cuda
      n_runs: 3
      seed: 42
      projections: [umap, tsne, pca]
      save_crop_info: true
      overwrite: false
      fail_fast: false
      write_manifest: true

  embedding_robustness:
    enabled: true
    config_overrides:
      n_runs: 3
      seed: 42

      # Intrinsic-dimension estimators used on each embedding output.
      id_methods: [MLE, TwoNN, TLE, DANCo, FisherS, MOM, CorrInt, ESS, MiNDML, MiNDKL, MADA]
      id_k_values: [5, 10, 20]
      max_id_samples: 20000

  data_kernel_analysis:
    enabled: true
    config_overrides:
      n_runs: 3
      seed: 42
      projections: [umap, tsne, pca]

  geodesic_compare:
    enabled: true
    config_overrides:
      n_runs: 3
      seed: 42
      projections: [umap, tsne, pca]

  demsar_wrapper:
    enabled: true
    config_overrides:
      alpha: 0.05

analysis:
  alpha: 0.05

