# embed_hlsburnscars_croma_dofa.yaml

work_dir: ./work
embed_dir: ./embeddings
out_dir: ./outputs
seed: 42

dataset:
  name: hlsburnscars
  dataset_name: hlsburnscars
  split: test
  task: segmentation
  instrument: HLS
  bands: [B2, B3, B4, B5, B6, B7]
  target_name: burn_scar
  bandset: hls_optical_6
  modalities: [optical]
  resolution: 30
  num_classes: 1
  ignore_index: 255
  data_root: /mnt/data/rdemilt/hlsburnscars/

dataset_init:
  label_name: burn_scar
  crs: EPSG:5070
  additional_instruments: null

model_names:
  - croma_base
  - dofa_base

model_init:
  pretrained: true
  features_only: true
  device: cuda

per_model_overrides:
  croma_base:
    weights: null
  dofa_base:
    weights: ../checkpoints/dofa/
    wavelengths:
      S2:
        B2: 0.49
        B3: 0.56
        B4: 0.665
        B5: 0.705
        B6: 0.74
        B7: 0.783

split: test
batch_size: 1
num_workers: 4
pin_memory: true
save_crop_info: true
overwrite: false
fail_fast: false
write_manifest: true
device: cuda
