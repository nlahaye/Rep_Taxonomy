# embed_hlsburnscars_croma_dofa.yaml

work_dir: /data/nlahaye/rep_taxonomy//work
embed_dir: /data/nlahaye/rep_taxonomy//embeddings
out_dir: /data/nlahaye/rep_taxonomy//outputs
seed: 42

dataset:
  name: hlsburnscars
  dataset_name: hlsburnscars
  split: test
  task: segmentation
  instrument: HLS
  bands: [B2, B3, B4, B5, B6, B7]
  target_name: burn_scar
  bandset: hls_optical_6
  modalities: [optical]
  resolution: 30
  num_classes: 1
  ignore_index: 255
  data_root: /data/nlahaye/rep_taxonomy/data/hlsburnscars/

dataset_init:
  label_name: burn_scar
  crs: EPSG:5070
  additional_instruments: null

model_names:
  - prithvi_eo_v1_100m
  - croma_large
  - dofa_base

model_init:
  pretrained: true
  features_only: true
  device: cuda

per_model_overrides:
  prithvi_eo_v1_100m:
    weights: /data/nlahaye/output/Pangaea/model/Prithvi_100M.pt
    image_size: 512
  croma_large:
    weights: /data/nlahaye/rep_taxonomy/checkpoints/croma/CROMA_large.pt
    modalities: [optical]
    image_size: 512
    patch_size: 8
    encoder_dim: 768
    encoder_depth: 12
    num_heads: 16
    variant: large
  dofa_base:
    weights: /data/nlahaye/rep_taxonomy/checkpoints/dofa/DOFA_ViT_base_e100.pth
    image_size: 512
    wavelengths:
      HLS:
        B2: 0.49
        B3: 0.56
        B4: 0.665
        B5: 0.705
        B6: 0.74
        B7: 0.783

split: test
batch_size: 1
num_workers: 4
pin_memory: true
save_crop_info: true
overwrite: false
fail_fast: false
write_manifest: true
device: cuda
