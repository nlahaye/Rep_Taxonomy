work_dir: /data/experiments/reptaxonomy/work
embed_dir: /data/experiments/reptaxonomy/embeddings
out_dir: /data/experiments/reptaxonomy/outputs
seed: 42
n_runs: 3

encoder: clay_v1

dataset:
  dataset_name: ben_ge
  num_classes: 19
  ignore_index: 255

label_file_subset: 2000
build_knn: true
knn_metric: euclidean

projections:
  - umap
  - tsne
  - pca

umap_n_neighbors: 30
umap_min_dist: 0.05
umap_n_components: 2
umap_spread: 1.0

pca_max_components: 64
tsne_n_jobs: 8

test_batch_size: 1
test_num_workers: 4

