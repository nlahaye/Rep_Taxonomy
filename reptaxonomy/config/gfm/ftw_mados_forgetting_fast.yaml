# Catastrophic forgetting across FTW and MADOS in one joint root that LINKS the per-family roots
# (no re-embedding, no re-training). Build / refresh the links first:
#
#   python -m reptaxonomy.pipelines.link_roots --dest ./gfm_runs/ftw_mados_joint \
#       --src ./gfm_runs/ftw ./gfm_runs/mados
#   python -m reptaxonomy.pipelines.gfm_experiment -y reptaxonomy/config/gfm/ftw_mados_forgetting_fast.yaml \
#       --stages forgetting ft_sequential
#
# Retention sets: FTW runs -> held-out FTW countries (same family) + MADOS test (cross family);
# MADOS run -> FTW test-split countries (cross family). Missing retention-set embeddings are
# computed on the GPU and written into the source roots through the links.
base: [ftw_finetune_fast.yaml, mados_finetune_fast.yaml]
root_dir: ./gfm_runs/ftw_mados_joint
mode: finetune_compare

finetune:
  # the runs filter applies to every family: list the MADOS run too
  runs: [ftw-germany-cambodia, ftw-south_africa-window, ftw-all-window, mados-train]
  epochs: 20                   # ft_sequential steps only (the per-family fine-tunes are linked)

forgetting:
  enabled: true
  retention: {same_family: true, cross_family: true, include_ood: false, max_per_family: 3}
  layerwise: {enabled: true, max_retention: 2}
  geo_id: true
  sequential:
    # FTW then MADOS, plain and with EWC: does the second task erase the first?
    - {name: ftw_then_mados, steps: ["ftw:ftw-germany-cambodia", "mados:mados-train"], mode: full}
    - {name: ftw_then_mados_ewc, steps: ["ftw:ftw-germany-cambodia", "mados:mados-train"], mode: full,
       regularizer: ewc, reg_weight: 100.0}

# patch-level geo_id cells differ per family (MADOS 240 px chips -> 7 x 7, FTW 256 px -> 8 x 8)
geo_id:
  token_cells: 8
  datasets: {mados: {token_cells: 7}}
pipeline_workers: 1
