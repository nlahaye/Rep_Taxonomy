# EPA: one fine-tuning run per region split scheme (epa-within_group, epa-east_west): train regions ->
# val region, evaluated on the pooled test split and on each test ecoregion (all OOD regions).
base: epa_pretrained.yaml
mode: finetune_compare
root_dir: ./gfm_runs/epa

finetune:
  modes: [linear, full]
  epochs: 15
  batch_size: 8
  max_train_samples: 4000
  max_eval_samples: 300
